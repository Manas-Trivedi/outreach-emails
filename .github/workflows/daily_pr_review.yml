name: Daily PR Review Bot

on:
  schedule:
    # Run 8 times per day, spread throughout the day
    # Times: 8 AM, 10 AM, 12 PM, 2 PM, 4 PM, 6 PM, 8 PM, 10 PM (UTC)
    - cron: '0 8 * * *'   # 8 AM UTC
    - cron: '0 10 * * *'  # 10 AM UTC
    - cron: '0 12 * * *'  # 12 PM UTC
    - cron: '0 14 * * *'  # 2 PM UTC
    - cron: '0 16 * * *'  # 4 PM UTC
    - cron: '0 18 * * *'  # 6 PM UTC
    - cron: '0 20 * * *'  # 8 PM UTC
    - cron: '0 22 * * *'  # 10 PM UTC
  
  # Allow manual triggering for testing
  workflow_dispatch:
    inputs:
      num_reviews:
        description: 'Number of PRs to review'
        required: false
        default: '1'

jobs:
  review-prs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests PyGithub python-dotenv
    
    - name: Review PRs
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO_OWNER: ${{ github.repository_owner }}
        REPO_NAME: ${{ github.event.repository.name }}
      run: |
        python .github/scripts/auto_reviewer.py
    
    - name: Summary
      run: |
        echo "✅ Daily PR review completed!"
        echo "Check the Actions log for details"
